<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WebSocket Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "JetBrains Mono", 'Courier New', monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 1rem;
            background-color: #111;
            font-size: 1.8rem;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .section {
            flex: 1;
            display: flex;
            border-top: 1px solid #333;
        }

        .top-section {
            display: flex;
            flex: 1;
            padding: 1rem;
            gap: 1rem;
        }

        .matrix {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* Customize size */
            gap: 4px;
        }

        .matrix-cell {
            background-color: #1c1c1c;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
        }

        .value-box {
            flex: 1;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border-radius: 4px;
        }

        .list-section {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            background-color: #1c1c1c;
            margin-bottom: 5px;
            padding: 6px 12px;
            border-radius: 4px;
            animation: fadeIn 0.2s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading {
            padding: 1rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
<header>WebSocket Dashboard</header>

<main>
    <div class="section top-section">
        <div class="matrix" id="matrix"></div>
        <div class="value-box" id="value1">--</div>
        <div class="value-box" id="value2">--</div>
    </div>

    <div class="section list-section">
        <ul id="list1"></ul>
    </div>

    <div class="section list-section">
        <ul id="list2"></ul>
    </div>
</main>

<script>
    const socket = new WebSocket("ws://localhost:8080/ws");

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        // data expected format: { matrix: [[...], [...]], value1: "xx", value2: "yy", list1: [...], list2: [...] }

        // Matrix
        const matrixEl = document.getElementById("matrix");
        matrixEl.innerHTML = '';
        data.matrix.flat().forEach(val => {
            const cell = document.createElement("div");
            cell.className = "matrix-cell";
            cell.textContent = val;
            matrixEl.appendChild(cell);
        });

        // Values
        document.getElementById("value1").textContent = data.value1;
        document.getElementById("value2").textContent = data.value2;

        // List 1
        const list1El = document.getElementById("list1");
        list1El.innerHTML = '';
        data.list1.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            list1El.appendChild(li);
        });

        // List 2
        const list2El = document.getElementById("list2");
        list2El.innerHTML = '';
        data.list2.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item;
            list2El.appendChild(li);
        });
    };

    socket.onerror = () => {
        document.body.innerHTML = '<div class="loading">Failed to connect to the WebSocket server.</div>';
    };
</script>
</body>
</html>
