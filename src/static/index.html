<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T1-SO: Observability Server</title>
    <style>
        body {
            font-family: "Jetbrains Mono", monospace;
            background-color: #000000;
            color: #f5f5f5;
            margin: 0;
            padding: 0px;
            display: flex;
            gap: 0px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #ffffff;
        }

        h3 {
            text-align: justify;
            margin: 5px;
            color: #888888;
        }

        .block1,
        .block2,
        .block3 {
            background-color: #111111;
            border-radius: 0px;
            padding: 16px;
            box-sizing: border-box;
            width: 33.33%;
            height: auto;
            margin-left: 5px;
            margin-right: 5px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .data-list {
            color: #5c5c5c;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            gap: 0px;
            padding: 5px;
        }

        .data-list>div {
            border: 1px solid #1b1b1b;
            padding: 2px;
        }

        .highlight {
            border-radius: 2px;
            padding: 3px;
            margin-left: 0;
            margin-right: 0;
            background-color: #444;
            color: #fff;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table th,
        table td {
            border: 1px solid #333;
            padding: 4px;
            text-align: left;
        }

        .pc-box {
            font-size: 20px;
            align-self: center;
            padding: 6px;
            background-color: #222;
            display: inline-block;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="block1">
        <h2>Processor Info</h2>
        <div class="pc-box">PC: <span id="pc">0</span></div>

        <div>
            <h3>Registers</h3>
            <table id="registers">
                <thead>
                    <tr>
                        <th>Register</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div>
            <h3>Interruption Bits</h3>
            <table id="interruptions">
                <thead>
                    <tr>
                        <th>Bit</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="block2">
        <h2>Memory View</h2>
        <div class="data-list" id="memory"></div>
    </div>

    <div class="block3">
        <h2>Kernel</h2>
        <div><strong>PID:</strong> <span id="pid">-</span></div>
        <div><strong>Current Frame:</strong> <span id="currentFrame">-</span></div>
        <div>
            <h3>Page Table</h3>
            <table id="pageTable">
                <thead>
                    <tr>
                        <th>Page</th>
                        <th>Frame</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const pcEl = document.getElementById("pc");
        const regTableBody = document.querySelector("#registers tbody");
        const memEl = document.getElementById("memory");
        const interruptTableBody = document.querySelector("#interruptions tbody");
        const pidEl = document.getElementById("pid");
        const currentFrameEl = document.getElementById("currentFrame");
        const pageTableBody = document.querySelector("#pageTable tbody");

        const socket = new WebSocket("ws://localhost:8080/ws");

        socket.onmessage = function (event) {
            const msg = JSON.parse(event.data);

            // Update PC
            pcEl.textContent = `0x${msg.Pc.toString(16).padStart(6, '0')} (${msg.Pc})`;

            // Update registers table
            regTableBody.innerHTML = "";
            for (const key in msg.Registers) {
                const row = document.createElement("tr");
                row.innerHTML = `<td>${key}</td><td>${msg.Registers[key]}</td>`;
                regTableBody.appendChild(row);
            }

            // Update interruption bits
            interruptTableBody.innerHTML = "";
            for (const bit in msg.InterruptionBits) {
                const row = document.createElement("tr");
                const isActive = msg.InterruptionBits[bit];
                row.innerHTML = `<td>${bit}</td><td>${isActive}</td>`;
                if (isActive) {
                    row.style.backgroundColor = "green";
                }
                interruptTableBody.appendChild(row);
            }

            // Update memory view
            const sliceSize = 28;
            const half = Math.floor(sliceSize / 2);
            const data = msg.Data;
            const pc = msg.Pc;

            let start = Math.max(0, pc - half);
            let end = Math.min(data.length, start + sliceSize);

            if (end - start < sliceSize && end === data.length) {
                start = Math.max(0, end - sliceSize);
            }

            memEl.innerHTML = "";
            for (let i = start; i < end; i++) {
                const el = document.createElement("div");
                el.textContent = `0x${i.toString(16).padStart(6, '0')}: ${data[i]}`;
                if (i === pc) el.classList.add("highlight");
                memEl.appendChild(el);
            }

            // Update PID and Current Frame
            pidEl.textContent = msg.PID;
            currentFrameEl.textContent = msg.CurrentFrame;

            // Update Page Table
            pageTableBody.innerHTML = "";
            msg.PageTable.forEach((frame, page) => {
                const row = document.createElement("tr");
                row.innerHTML = `<td>${page}</td><td>${frame}</td>`;
                pageTableBody.appendChild(row);
            });
        };
    </script>

</body>

</html>
